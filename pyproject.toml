[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kesurv"
version = "0.1.0"
description = "Kernel ensemble survival estimation with forest neighborhoods"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahul Goswami" }]
keywords = [
  "survival analysis",
  "random survival forest",
  "kaplan-meier",
  "ensemble",
  "scikit-survival",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "scikit-survival>=0.22",
]

[project.optional-dependencies]
speed = ["numba>=0.59"]
test = ["pytest>=7", "numba>=0.59", "pandas>=1.5"]
docs = [
  "sphinx>=7.2,<9",
  "furo>=2024.8.6",
  "myst-nb>=1.1,<2",
  "sphinx-copybutton>=0.5,<1",
]
demo = ["matplotlib>=3.8", "nbclient>=0.10", "nbformat>=5", "ipykernel>=6"]

[project.urls]
Homepage = "https://kesurv.statml.in"
Documentation = "https://kesurv.statml.in"
Source = "https://github.com/yuvrajiro/kesurv"
Issues = "https://github.com/yuvrajiro/kesurv/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
